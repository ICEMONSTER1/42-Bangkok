<!DOCTYPE html>
<html>
<head>
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .shop {
            text-align: center;
        }

        .shop img {
            width: 300px;
            height: 200px;
            object-fit: contain;
        }

        .shop a {
            display: block;
            margin-top: 10px;
        }

        hr {
            margin-top: 30px;
        }

        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>Online Shops &amp; More!</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <a href="https://www.amazon.com/">Amazon</a>
        </div>

        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <a href="https://www.ebay.com/">eBay</a>
        </div>

    </div>

    <hr>

    <footer>
        &copy; palohama 2026
    </footer>

</body>
</html>
