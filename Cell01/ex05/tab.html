<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
</head>
<body>
    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <td style="background-color: lightgreen; height: 100px; border: 1px solid black;">
                First cell
            </td>
            <td style="background-color: lightpink; height: 100px; border: 1px solid black;">
                Second cell
            </td>
        </tr>
    </table>
</body>
</html>
